name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # 毎週日曜日に実行

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit
          echo "Security audit completed"

      - name: Check for outdated packages
        run: |
          npm outdated || true
          echo "Package version check completed"

      - name: Run ESLint security rules
        run: |
          npm run lint || true
          echo "ESLint security check completed"

      - name: Run TypeScript compiler checks
        run: |
          npm run build || true
          echo "TypeScript checks completed"

      - name: Create issue on security concerns
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security concerns detected',
              body: 'Weekly security audit has detected potential issues. Please review the workflow logs.',
              labels: ['security']
            }); 