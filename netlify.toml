[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# リダイレクトとrewriteルール
[[redirects]]
  from = "/partners"
  to = "/partners"
  status = 200
  
[[redirects]]
  from = "/news/*"
  to = "/news/:splat"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about"  
  status = 200

# SPA フォールバック
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 